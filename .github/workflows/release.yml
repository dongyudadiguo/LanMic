name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-build.txt

      - name: Smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v

      - name: Build
        run: python -m PyInstaller packaging/lanmic.spec --noconfirm --clean

      - name: Stage zip
        shell: pwsh
        run: |
          $ver = python -c "from lanmic import __version__; print(__version__)"
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v$ver" }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          Copy-Item -Force "packaging/使用说明.txt" "dist/LanMic/使用说明.txt"
          $name = "LanMic-$tag-windows-x64.zip"
          $dest = Join-Path "dist" $name
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path "dist/LanMic" -DestinationPath $dest -Force
          "ASSET=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Item $dest | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanmic-windows-x64
          path: dist/LanMic-*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: ${{ env.ASSET }}
          body: |
            解压后双击 `LanMic/LanMic.exe`，无需预装 Python。

            - 无黑框，托盘绿点退出；控制台页也可点「退出 LanMic」
            - 手机用 Chrome / Edge 扫码，同一 Wi-Fi
            - 口述写提示词：安装 Wave Link（`winget install Elgato.WaveLink`）后，系统输入选 `Wave Link`，按 Win+H
            - Windows SmartScreen 可能提示未知发布者：更多信息 → 仍要运行

            源码版仍可用 `python -m lanmic`。
