[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanmic"
version = "0.1.0"
description = "用手机浏览器当 Windows 麦克风（局域网 WebRTC），方便口述写提示词。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "dongyudadiguo" }]
keywords = ["webrtc", "microphone", "windows", "dictation", "prompt", "lan"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
    "aiohttp>=3.10",
    "aiortc>=1.9",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "qrcode>=8.0",
    "cryptography>=43.0",
]

[project.scripts]
lanmic = "lanmic.app:main"

[project.urls]
Changelog = "CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["lanmic*"]

[tool.setuptools.package-data]
lanmic = []
